    // --- MOCK CHAT MESSAGES ---

    // --- FORMATTER HELPERS ---
    const maskPhoneNumber = (phoneStr) => {
      if (!phoneStr) return "+90 5** *** ** **";
      const parts = phoneStr.split(' ');
      if (parts.length >= 4) {
        return `${parts[0]} ${parts[1]} *** ${parts[3]} ${parts[4] || ''}`.trim();
      }
      return phoneStr.replace(/(\d{3})\d{3}(\d{4})/, "$1***$2");
    };

    const getRankDegree = (score) => {
      if (score >= 90) return { label: "🥇 S-Seviye (Mükemmel Uyum)", badgeClass: "bg-[#E30A17] text-white border-red-300" };
      if (score >= 85) return { label: "🥈 A-Seviye (Yüksek Uyum)", badgeClass: "bg-emerald-600 text-white border-emerald-300" };
      if (score >= 75) return { label: "🥉 B-Seviye (Orta-İleri Uyum)", badgeClass: "bg-sky-600 text-white border-sky-300" };

    };

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [activePortal, setActivePortal] = useState('koordinator');
      const [radarViewMode, setRadarViewMode] = useState('cards');
      const [bursiyerTab, setBursiyerTab] = useState('dashboard');

      const [currentUser, setCurrentUser] = useState(INITIAL_CANDIDATES[0]);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState("ahmet.yilmaz@t3burs.org");
      const [loginPassword, setLoginPassword] = useState("123456");

      const [candidates, setCandidates] = useState(INITIAL_CANDIDATES);

      const [searchQuery, setSearchQuery] = useState("Veri analitiği yapabilen ve daha önce eğitim kamplarında takım kaptanlığı yapmış biri");
      const [isSearching, setIsSearching] = useState(false);
      const [minMatchFilter, setMinMatchFilter] = useState(50);
      const [selectedTechFilter, setSelectedTechFilter] = useState("HEPSİ");
      const [selectedCandidateDetail, setSelectedCandidateDetail] = useState(null);
      const [searchProcessingStep, setSearchProcessingStep] = useState("");

      const [isParsingCv, setIsParsingCv] = useState(false);
      const [cvAnalysisResult, setCvAnalysisResult] = useState(null);

      const [activeChannel, setActiveChannel] = useState("teknofest-takim");
      const [chatMessages, setChatMessages] = useState(INITIAL_CHAT_MESSAGES);
      const [newMessageText, setNewMessageText] = useState("");

      const [profileForm, setProfileForm] = useState({
        fullName: currentUser ? currentUser.fullName : "",
        title: currentUser ? currentUser.title : "",
        location: currentUser ? currentUser.location : "",
        bio: currentUser ? currentUser.bio : "",
        github: currentUser ? currentUser.github : "",
        linkedin: currentUser ? currentUser.linkedin : "",
        techStackStr: currentUser ? currentUser.techStack.join(", ") : "",
        frontend: currentUser ? currentUser.competencies.frontend : 85,
        autonomous: currentUser ? currentUser.competencies.autonomous : 80,
        cloud: currentUser ? currentUser.competencies.cloud : 80,
        leadership: currentUser ? currentUser.competencies.leadership : 85,
        ai: currentUser ? currentUser.competencies.ai : 75
      });
      const [profileSavedNotice, setProfileSavedNotice] = useState(false);

      const PRESET_QUERIES = [
        { label: "📊 Veri Analitiği & Kaptanlık", text: "Veri analitiği yapabilen ve daha önce eğitim kamplarında takım kaptanlığı yapmış biri" },
        { label: "🚁 İHA / Otonom & React", text: "İHA/GKS otonom sistem tasarlamış, React ve Firebase bilen geliştirici" },
        { label: "🏆 Teknofest Derecesi & Python", text: "Teknofest dereceli, Python, ROS2 ve görüntü işleme uzmanı" },
        { label: "🌐 Full-Stack & Firebase Security", text: "React, Tailwind CSS ve Firebase veritabanı uzmanı" }
      ];

      const evaluateVectorMatch = (query, candidate) => {
        if (!query || query.trim() === "") return { score: candidate.defaultScore, reason: candidate.baseReason };

        const qLower = query.toLowerCase();
        let scoreBoost = 0;
        let matchedTerms = [];

        const terms = [
          { kw: ["veri analitiği", "veri analizi", "pandas", "sql", "veri"], weight: 18, term: "Veri Analitiği" },
          { kw: ["takım kaptanı", "kaptan", "liderlik", "eğitim kampı", "eğitmen"], weight: 16, term: "Takım Kaptanlığı" },
          { kw: ["iha", "otonom", "gks", "deniz aracı", "ida", "ros2"], weight: 20, term: "Otonom Sistemler (İHA/İDA)" },
          { kw: ["react", "tailwind", "frontend", "html", "geliştirici"], weight: 15, term: "React/Tailwind Frontend" },
          { kw: ["firebase", "firestore", "güvenlik", "node"], weight: 16, term: "Firebase & Bulut Teknolojileri" },
          { kw: ["python", "teknofest", "yapay zekâ", "nlp", "claude", "pytorch"], weight: 15, term: "Yapay Zekâ / Teknofest" }
        ];

        terms.forEach(t => {
          if (t.kw.some(k => qLower.includes(k))) {
            const matchesTech = candidate.techStack.some(ts => t.kw.some(k => ts.toLowerCase().includes(k)));
            const matchesProj = candidate.projectHistory.some(p => t.kw.some(k => p.title.toLowerCase().includes(k) || p.role.toLowerCase().includes(k)));
            
            if (matchesTech || matchesProj) {
              scoreBoost += t.weight;
              matchedTerms.push(t.term);
            }
          }
        });

        let computedScore = Math.min(98, Math.max(62, 58 + scoreBoost));
        let generatedReason = matchedTerms.length > 0
          ? `Aday; ${matchedTerms.join(", ")} alanlarındaki tecrübesi ve aktif proje geçmişi nedeniyle aramanızla %${computedScore} eşleşmektedir.`
          : `Aday, genel mühendislik ve proje yetkinlikleri çerçevesinde aramanızla %${computedScore} temel uyum göstermektedir.`;

        return { score: computedScore, reason: generatedReason };
      };

      const matchedCandidates = useMemo(() => {
        return candidates.map(candidate => {
          const matchResult = evaluateVectorMatch(searchQuery, candidate);
          return {
            ...candidate,
            matchScore: matchResult.score,
            aiReason: matchResult.reason,
            rankDegree: getRankDegree(matchResult.score)
          };
        })
        .filter(c => c.matchScore >= minMatchFilter)
        .filter(c => selectedTechFilter === "HEPSİ" || c.techStack.includes(selectedTechFilter))
        .sort((a, b) => b.matchScore - a.matchScore);
      }, [candidates, searchQuery, minMatchFilter, selectedTechFilter]);

      const handleSearchSubmit = (e) => {
        if (e) e.preventDefault();
        setIsSearching(true);
        setSearchProcessingStep("Claude LLM Metin Semantiği Çözümleniyor...");
        setTimeout(() => setSearchProcessingStep("Vektör Embedding Matrisi Hesaplanıyor (Cosine Similarity)..."), 200);
        setTimeout(() => setSearchProcessingStep("Yetkinlik Matrisi & Dereceler Sıralanıyor..."), 400);
        setTimeout(() => { setIsSearching(false); setSearchProcessingStep(""); }, 600);
      };

      const handlePresetClick = (queryText) => {
        setSearchQuery(queryText);
        setIsSearching(true);
        setTimeout(() => setIsSearching(false), 350);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const found = candidates.find(c => c.email.toLowerCase() === loginEmail.toLowerCase());
        if (found) {
          setCurrentUser(found);
          setProfileForm({
            fullName: found.fullName,
            title: found.title,
            location: found.location,
            bio: found.bio,
            github: found.github || "",
            linkedin: found.linkedin || "",
            techStackStr: found.techStack.join(", "),
            frontend: found.competencies.frontend,
            autonomous: found.competencies.autonomous,
            cloud: found.competencies.cloud,
            leadership: found.competencies.leadership,
            ai: found.competencies.ai
          });
          setShowAuthModal(false);
        } else {
          const newId = `BURS-2025-${Math.floor(100 + Math.random() * 900)}`;
          const newUser = {
            id: newId,
            fullName: loginEmail.split('@')[0].toUpperCase(),
            title: "T3 Yeni Bursiyeri",
            location: "İstanbul (DENEYAP)",
            email: loginEmail,
            phone: "+90 500 000 00 00",
            bio: "T3 Vakfı yeni kayıtlı bursiyer profili.",
            github: "github.com",
            linkedin: "linkedin.com",
            badges: ["✨ Yeni Bursiyer"],
            techStack: ["React", "HTML", "Python"],
            competencies: { frontend: 80, autonomous: 70, cloud: 75, leadership: 80, ai: 70 },
            projectHistory: [{ title: "T3 Oryantasyon Eğitimi", category: "Eğitim", year: "2024", role: "Bursiyer" }],
            defaultScore: 80,
            baseReason: "Yeni kayıtlı bursiyer profili."
          };
          setCandidates(prev => [newUser, ...prev]);
          setCurrentUser(newUser);
          setShowAuthModal(false);
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
      };

      const handleCvUploadSimulation = (e) => {
        const file = e.target.files ? e.target.files[0] : null;
        if (!file || !currentUser) return;
        setIsParsingCv(true);
        setCvAnalysisResult(null);

        setTimeout(() => {
          setIsParsingCv(false);
          setCvAnalysisResult({
            fileName: file.name,
            extractedSkills: ["React 18", "Tailwind CSS", "Firebase Auth", "Python 3.12", "ROS2", "Teknofest İHA Finalisti"],
            vectorEmbeddingStatus: "✅ Yapay Zekâ Vektör Profilinize İşlendi!",
            matchScoreImprovement: "+15% Uyum Artışı Kazandınız"
          });

          setCandidates(prev => prev.map(c => {
            if (c.id === currentUser.id) {
              const updatedTech = Array.from(new Set([...c.techStack, "ROS2", "Python 3.12", "Firebase Auth"]));
              return { ...c, techStack: updatedTech, competencies: { ...c.competencies, cloud: Math.min(98, c.competencies.cloud + 8) } };
            }
            return c;
          }));
        }, 1200);
      };

      const handleProfileSave = (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const updatedTechStack = profileForm.techStackStr.split(",").map(s => s.trim()).filter(Boolean);
        const updatedUser = {
          ...currentUser,
          fullName: profileForm.fullName,
          title: profileForm.title,
          location: profileForm.location,
          bio: profileForm.bio,
          github: profileForm.github,
          linkedin: profileForm.linkedin,
          techStack: updatedTechStack,
          competencies: {
            frontend: Number(profileForm.frontend),
            autonomous: Number(profileForm.autonomous),
            cloud: Number(profileForm.cloud),
            leadership: Number(profileForm.leadership),
            ai: Number(profileForm.ai)
          }
        };

        setCurrentUser(updatedUser);
        setCandidates(prev => prev.map(c => c.id === updatedUser.id ? updatedUser : c));
        setProfileSavedNotice(true);
        setTimeout(() => setProfileSavedNotice(false), 3000);
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !currentUser) return;
        const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        const newMsg = {
          id: Date.now(),
          sender: currentUser.fullName,
          avatar: currentUser.fullName.split(' ').map(n => n[0]).join(''),
          time: time,
          text: newMessageText
        };
        setChatMessages(prev => ({ ...prev, [activeChannel]: [...(prev[activeChannel] || []), newMsg] }));
        setNewMessageText("");
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-800 font-sans flex flex-col selection:bg-[#E30A17] selection:text-white relative">
          
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
            <div className="absolute -top-24 -left-24 w-[30rem] h-[30rem] bg-red-400/20 rounded-full blur-3xl animate-pulse"></div>
            <div className="absolute top-1/3 -right-24 w-[28rem] h-[28rem] bg-amber-300/20 rounded-full blur-3xl animate-pulse" style={{ animationDuration: '8s' }}></div>
            <div className="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:20px_20px]"></div>
          </div>

          <header className="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              <div className="flex items-center gap-6">
                <T3VakfiLogo />
                <div className="h-6 w-[1px] bg-slate-300 hidden sm:block"></div>
                <div className="hidden sm:block">
                  <TeknofestLogo />
                </div>
              </div>

              <div className="flex items-center gap-4">
                <div className="bg-slate-100 p-1.5 rounded-2xl border border-slate-200 flex items-center gap-1">
                  <button onClick={() => setActivePortal('koordinator')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-all ${activePortal === 'koordinator' ? "bg-[#E30A17] text-white shadow-md shadow-red-500/20" : "text-slate-600 hover:text-slate-900"}`}>
                    <span>🎯 Koordinatör Radarı</span>

                      <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 border border-slate-800">
                        <div className="flex items-center gap-5">
                          <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-[#E30A17] to-red-700 text-white font-extrabold text-2xl flex items-center justify-center border-2 border-white/20">
                            {currentUser.fullName.split(' ').map(n => n[0]).join('')}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h2 className="text-2xl font-extrabold">{currentUser.fullName}</h2>
                              <span className="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-0.5 rounded-full border border-emerald-500/30">Aktif Bursiyer</span>
                            </div>
                            <p className="text-xs text-slate-400 font-medium mt-1">{currentUser.title} • {currentUser.location}</p>
                            <p className="text-xs text-slate-300 mt-2 max-w-xl font-normal">{currentUser.bio}</p>
                          </div>
                        </div>

                        <div className="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/60 text-center shrink-0 w-full md:w-auto">
                          <span className="text-[10px] text-slate-400 font-bold uppercase block">Yapay Zekâ Profil Sağlığı</span>
                          <span className="text-3xl font-black text-[#E30A17] font-mono">%{currentUser.defaultScore}</span>
                          <span className="text-[11px] text-emerald-400 font-semibold block mt-0.5">Radarda Üst Sıralardasınız</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                          <h3 className="font-extrabold text-base text-slate-900 mb-3">🏆 Başarı Rozetleriniz</h3>
                          <div className="flex flex-wrap gap-2">
                            {(currentUser.badges || ["🏆 Teknofest Dereceli", "⚡ T3 Geliştiricisi"]).map((b, i) => (
                              <span key={i} className="bg-red-50 text-[#E30A17] text-xs font-bold px-3 py-1.5 rounded-xl border border-red-200">{b}</span>
                            ))}
                          </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                          <h3 className="font-extrabold text-base text-slate-900 mb-3">💻 Kayıtlı Teknoloji Yınınız</h3>
                          <div className="flex flex-wrap gap-1.5">
                            {currentUser.techStack.map((tech, i) => (
                              <span key={i} className="bg-slate-100 text-slate-800 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200">{tech}</span>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {bursiyerTab === 'cv' && (
                    <div className="max-w-4xl mx-auto bg-white rounded-2xl p-8 border border-slate-200 text-center shadow-xs">
                      <div className="w-16 h-16 bg-red-50 text-[#E30A17] rounded-2xl flex items-center justify-center mx-auto mb-4 border border-red-100">📂</div>
                      <h3 className="text-xl font-extrabold text-slate-900">Özgeçmişinizi (CV) Yükleyin</h3>
                      <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">Yapay Zekâ (Claude LLM) CV dosyanızdaki yetkinlikleri ayıklar ve radardaki puanınızı artırır.</p>

                      <div className="mt-6 border-2 border-dashed border-slate-300 hover:border-[#E30A17] rounded-2xl p-8 bg-slate-50 transition-all relative">
                        <input type="file" accept=".pdf,.docx,.doc" onChange={handleCvUploadSimulation} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                        <span className="text-xs font-bold text-slate-700">📁 PDF veya Word Dosyası Yükleyin (.PDF, .DOCX)</span>
                      </div>

                      {isParsingCv && (
                        <div className="mt-6 bg-red-50 border border-red-200 rounded-xl p-4 text-xs font-semibold text-[#E30A17] animate-pulse">
                          ⚡ Claude LLM CV Metnini Ayrıştırıyor ve Vektör Embeddings Oluşturuyor...
                        </div>
                      )}

                      {cvAnalysisResult && (
                        <div className="mt-6 bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-left">
                          <div className="flex justify-between items-center mb-3">
                            <h4 className="font-bold text-emerald-900 text-sm">✅ CV Yapay Zekâ Analizi Tamamlandı!</h4>
                            <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded">{cvAnalysisResult.matchScoreImprovement}</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5 mb-2">
                            {cvAnalysisResult.extractedSkills.map((sk, idx) => (
                              <span key={idx} className="bg-white text-emerald-900 text-xs font-semibold px-2 py-1 rounded border border-emerald-200">{sk}</span>
                            ))}
                          </div>
                          <p className="text-xs text-emerald-800 font-medium">{cvAnalysisResult.vectorEmbeddingStatus}</p>
                        </div>
                      )}
                    </div>
                  )}

                  {bursiyerTab === 'profile' && (
                    <div className="max-w-3xl mx-auto bg-white rounded-2xl p-8 border border-slate-200 shadow-xs">
                      <h3 className="text-lg font-extrabold text-slate-900 mb-1">Bursiyer Profilini Düzenle</h3>
                      <p className="text-xs text-slate-500 mb-6">Profil bilgileriniz koordinatörlerin yapay zekâ radarına anında yansır.</p>

                      {profileSavedNotice && (
                        <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-xl text-xs font-bold mb-4">
                          ✅ Profiliniz başarıyla güncellendi! Radarda üst sıralara yansıtıldı.
                        </div>
                      )}

                      <form onSubmit={handleProfileSave} className="space-y-4 text-xs">
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="font-bold block mb-1">Ad Soyad</label>
                            <input type="text" value={profileForm.fullName} onChange={(e) => setProfileForm({ ...profileForm, fullName: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                          </div>
                          <div>
                            <label className="font-bold block mb-1">Unvan</label>
                            <input type="text" value={profileForm.title} onChange={(e) => setProfileForm({ ...profileForm, title: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="font-bold block mb-1">Şehir / Atölye</label>
                            <input type="text" value={profileForm.location} onChange={(e) => setProfileForm({ ...profileForm, location: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                          </div>
                          <div>
                            <label className="font-bold block mb-1">Teknoloji Yığını</label>
                            <input type="text" value={profileForm.techStackStr} onChange={(e) => setProfileForm({ ...profileForm, techStackStr: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="font-bold block mb-1">GitHub Adresi</label>
                            <input type="text" value={profileForm.github} onChange={(e) => setProfileForm({ ...profileForm, github: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-medium" />
                          </div>
                          <div>
                            <label className="font-bold block mb-1">LinkedIn Adresi</label>
                            <input type="text" value={profileForm.linkedin} onChange={(e) => setProfileForm({ ...profileForm, linkedin: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-medium" />
                          </div>
                        </div>

                        <div>
                          <label className="font-bold block mb-1">Biyografi</label>
                          <textarea rows="3" value={profileForm.bio} onChange={(e) => setProfileForm({ ...profileForm, bio: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 font-medium"></textarea>
                        </div>

                        <div className="flex justify-end pt-3">
                          <button type="submit" className="bg-[#E30A17] text-white font-bold px-6 py-2.5 rounded-xl">Değişiklikleri Kaydet</button>
                        </div>
                      </form>
                    </div>
                  )}

                  {bursiyerTab === 'chat' && (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col md:flex-row h-[600px]">
                      <div className="w-full md:w-64 bg-slate-900 text-slate-300 p-4 border-r border-slate-800 flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold text-white text-sm mb-4">💬 Bursiyer Kanalları</h3>
                          <div className="space-y-1">
                            <button onClick={() => setActiveChannel("teknofest-takim")} className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold ${activeChannel === "teknofest-takim" ? "bg-[#E30A17] text-white" : "text-slate-400"}`}># teknofest-takim-arayanlar</button>
                            <button onClick={() => setActiveChannel("genel-sohbet")} className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold ${activeChannel === "genel-sohbet" ? "bg-[#E30A17] text-white" : "text-slate-400"}`}># genel-sohbet</button>
                            <button onClick={() => setActiveChannel("yazilim-ai")} className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold ${activeChannel === "yazilim-ai" ? "bg-[#E30A17] text-white" : "text-slate-400"}`}># yazilim-ve-ai</button>
                          </div>
                        </div>
                        <div className="text-[11px] text-slate-500">Aktif: <strong className="text-white">{currentUser.fullName}</strong></div>
                      </div>

                      <div className="flex-1 flex flex-col bg-slate-50">
                        <div className="bg-white px-6 py-3.5 border-b font-extrabold text-sm text-slate-900">#{activeChannel}</div>
                        <div className="flex-1 p-6 overflow-y-auto space-y-4">
                          {(chatMessages[activeChannel] || []).map((msg) => (
                            <div key={msg.id} className="flex items-start gap-3">
                              <div className="w-8 h-8 rounded-full bg-slate-200 text-slate-800 font-bold text-xs flex items-center justify-center shrink-0">{msg.avatar}</div>
                              <div className="bg-white p-3 rounded-2xl border max-w-xl">
                                <div className="flex items-center gap-2 mb-1">
                                  <span className="font-bold text-xs text-slate-900">{msg.sender}</span>
                                  <span className="text-[10px] text-slate-400 font-mono">{msg.time}</span>
                                </div>
                                <p className="text-xs text-slate-700">{msg.text}</p>
                              </div>
                            </div>
                          ))}
                        </div>

                        <form onSubmit={handleSendMessage} className="bg-white p-4 border-t flex items-center gap-3">
                          <input type="text" value={newMessageText} onChange={(e) => setNewMessageText(e.target.value)} placeholder={`Mesaj yazın...`} className="flex-1 bg-slate-50 border rounded-xl px-4 py-2.5 text-xs" />
                          <button type="submit" className="bg-[#E30A17] text-[#FFFFFF] text-xs font-bold px-4 py-2.5 rounded-xl">Gönder 🚀</button>
                        </form>
                      </div>
                    </div>
                  )}

                </div>
              )}
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200 relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>

                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-red-50 text-[#E30A17] font-bold text-xl flex items-center justify-center mx-auto mb-3 border border-red-100">T3</div>
                  <h3 className="font-extrabold text-xl text-slate-900">{authMode === 'login' ? "Bursiyer Girişi" : "Yeni Bursiyer Kaydı"}</h3>
                  <p className="text-xs text-slate-500 mt-1">T3 Vakfı E-Posta hesabınızla oturum açın.</p>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">T3 E-Posta Adresi</label>
                    <input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="ahmet.yilmaz@t3burs.org" className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Parola</label>
                    <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-50 border rounded-xl p-2.5 font-semibold" />
                  </div>
                  <button type="submit" className="w-full bg-[#E30A17] text-white font-bold py-3 rounded-xl shadow-md text-xs mt-2">
                    {authMode === 'login' ? "Giriş Yap 🚀" : "Kayıt Ol & Başla"}
                  </button>
                </form>

                <div className="mt-6 pt-4 border-t text-center text-xs text-slate-500">
                  {authMode === 'login' ? (
                    <p>Hesabınız yok mu? <button onClick={() => setAuthMode('register')} className="font-bold text-[#E30A17]">Kayıt Olun</button></p>
                  ) : (
                    <p>Zaten hesabınız var mı? <button onClick={() => setAuthMode('login')} className="font-bold text-[#E30A17]">Giriş Yapın</button></p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* DETAIL MODAL */}
          {selectedCandidateDetail && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center gap-3 border-b border-slate-200 pb-3 mb-3">
                  <div className="w-10 h-10 rounded-full bg-red-50 text-[#E30A17] font-bold text-base flex items-center justify-center border border-red-200">
                    {selectedCandidateDetail.fullName.split(' ').map(n => n[0]).join('')}
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-slate-900">{selectedCandidateDetail.fullName}</h3>
                    <span className="text-xs font-mono text-slate-500">{selectedCandidateDetail.id}</span>
                  </div>
                </div>
                <div className="bg-slate-50 p-3 rounded-xl text-xs space-y-2 mb-4">
                  <div className="flex justify-between"><b>E-Posta:</b> <span className="font-mono">{selectedCandidateDetail.email}</span></div>
                  <div className="flex justify-between"><b>Telefon (Maskeli):</b> <span className="font-mono font-bold text-red-600">{maskPhoneNumber(selectedCandidateDetail.phone)}</span></div>
                  <div className="flex justify-between"><b>Yer / Atölye:</b> {selectedCandidateDetail.location}</div>
                  <div className="flex justify-between"><b>En Yüksek Uyum:</b> <span className="font-bold text-[#E30A17]">%{selectedCandidateDetail.matchScore}</span></div>
                </div>
                <button onClick={() => setSelectedCandidateDetail(null)} className="w-full bg-slate-900 text-white text-xs font-bold py-2.5 rounded-xl">Kapat</button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500 relative z-10">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <T3VakfiLogo />
                <span>•</span>
                <span className="font-bold text-slate-800">Teknofest Destekli Yetkinlik Radarı</span>
              </div>
              <p>© 2026 T3 Vakfı Geliştirici Ekibi. Tüm Hakları Saklıdır.</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
